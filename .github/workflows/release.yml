# Legt automatisch ein GitHub-Release an, sobald sich die Version in
# custom_components/hargassner/manifest.json ändert. HACS zeigt dann in
# Home Assistant die Versionsnummer (z. B. v0.5.2) statt eines Commit-Hashes.
name: Release

on:
  push:
    branches: [main]
    paths:
      - "custom_components/hargassner/manifest.json"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version aus manifest.json lesen
        id: version
        run: echo "tag=v$(jq -r .version custom_components/hargassner/manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Release anlegen, falls es die Version noch nicht gibt
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG existiert bereits."
            exit 0
          fi
          git log -1 --pretty=%B \
            | sed -e '/^Co-Authored-By:/d' -e '/^Claude-Session:/d' > notes.md
          printf '\nNach dem Update Home Assistant neu starten.\n' >> notes.md
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
